# Select your debug interface (uncomment the one you are using)
source [find interface/stlink.cfg]
# source [find interface/stlink-v2.cfg]
# source [find interface/stlink-v2-1.cfg]

# Select transport protocol
#transport select swd

# Set internal SRAM working area to 64KB for faster flash programming
set WORKAREASIZE 0x10000

# Load the target configuration file for STM32F4 series
source [find target/stm32f4x.cfg]

# Configure reset behavior (use hardware reset, connect under reset)
#reset_config srst_only