name: Release

# Builds the firmware with the arm-none-eabi toolchain and, for tag
# pushes (v1.2.3 etc.), attaches the built .elf/.bin/.hex to a GitHub
# Release. workflow_dispatch lets you trigger a build manually (e.g.
# to sanity-check the build without cutting a release).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (Release preset)
        run: cmake --preset Release

      - name: Build
        run: cmake --build build/Release

      - name: Report firmware size
        run: arm-none-eabi-size build/Release/EPROM_Programmer_with_STM32F407VG.elf

      - name: Generate .bin and .hex images
        run: |
          arm-none-eabi-objcopy -O binary \
            build/Release/EPROM_Programmer_with_STM32F407VG.elf \
            build/Release/EPROM_Programmer_with_STM32F407VG.bin
          arm-none-eabi-objcopy -O ihex \
            build/Release/EPROM_Programmer_with_STM32F407VG.elf \
            build/Release/EPROM_Programmer_with_STM32F407VG.hex

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/Release/EPROM_Programmer_with_STM32F407VG.elf
            build/Release/EPROM_Programmer_with_STM32F407VG.bin
            build/Release/EPROM_Programmer_with_STM32F407VG.hex

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/EPROM_Programmer_with_STM32F407VG.elf
            build/Release/EPROM_Programmer_with_STM32F407VG.bin
            build/Release/EPROM_Programmer_with_STM32F407VG.hex
            host/program.py
          generate_release_notes: true
